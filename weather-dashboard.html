<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 400px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.95);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        button {
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .unit-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .unit-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .unit-btn.active {
            background: white;
            color: #667eea;
        }

        .main-weather {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .location-info {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 40px;
        }

        .temperature {
            font-size: 4rem;
            font-weight: 300;
            display: flex;
            align-items: flex-start;
        }

        .temp-symbol {
            font-size: 2rem;
            margin-top: 10px;
            margin-left: 5px;
        }

        .weather-description {
            font-size: 1.5rem;
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .weather-icon {
            font-size: 3rem;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .detail-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }

        .detail-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-value {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .forecast-section {
            margin-top: 40px;
        }

        .forecast-title {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            color: white;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .forecast-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-5px);
        }

        .forecast-time {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 2rem;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .forecast-desc {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
            text-transform: capitalize;
        }

        .error-message {
            background: rgba(255, 59, 48, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .search-box {
                flex-direction: column;
                max-width: 100%;
            }

            .main-weather {
                padding: 25px;
            }

            .temperature {
                font-size: 2.5rem;
            }

            .weather-main {
                gap: 20px;
                justify-content: center;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather updates for any location</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Enter city name..." 
                    autocomplete="off"
                >
                <button onclick="searchWeather()">Search</button>
            </div>
            <div class="unit-toggle">
                <button class="unit-btn active" onclick="setUnit('metric')">°C</button>
                <button class="unit-btn" onclick="setUnit('imperial')">°F</button>
            </div>
        </div>

        <div id="weatherContainer">
            <div class="info-text">
                Enter a city name and click Search to see the weather
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'a6d8ebb0b78e3e443f77e9d0ff33ef15'; // Free tier API key
        let currentUnit = 'metric';
        let currentCity = '';

        // Weather icon mapping
        const iconMap = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '🌤️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        function setUnit(unit) {
            currentUnit = unit;
            document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (currentCity) {
                fetchWeather(currentCity);
            }
        }

        function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (city) {
                fetchWeather(city);
            }
        }

        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        async function fetchWeather(city) {
            const container = document.getElementById('weatherContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading weather data...</div>';

            try {
                // Fetch current weather
                const weatherResponse = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=${currentUnit}`
                );

                if (!weatherResponse.ok) {
                    throw new Error('City not found');
                }

                const weatherData = await weatherResponse.json();
                currentCity = city;

                // Fetch forecast
                const forecastResponse = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=${currentUnit}`
                );

                const forecastData = await forecastResponse.json();

                // Display weather
                displayWeather(weatherData, forecastData);
            } catch (error) {
                container.innerHTML = `<div class="error-message">❌ ${error.message}. Please try another city.</div>`;
            }
        }

        function displayWeather(data, forecastData) {
            const container = document.getElementById('weatherContainer');
            const tempUnit = currentUnit === 'metric' ? '°C' : '°F';
            const speedUnit = currentUnit === 'metric' ? 'm/s' : 'mph';
            
            const icon = iconMap[data.weather[0].icon] || '🌤️';
            const humidity = data.main.humidity;
            const windSpeed = data.wind.speed.toFixed(1);
            const feelsLike = data.main.feels_like.toFixed(0);
            const pressure = data.main.pressure;
            const visibility = (data.visibility / 1000).toFixed(1);

            // Unique forecast times (every 24 hours)
            const forecastList = forecastData.list.filter((item, index) => index % 8 === 0).slice(0, 5);

            let html = `
                <div class="main-weather">
                    <div class="location-info">
                        📍 ${data.name}, ${data.sys.country}
                    </div>
                    <div class="weather-main">
                        <div>
                            <div class="temperature">
                                ${Math.round(data.main.temp)}<span class="temp-symbol">${tempUnit}</span>
                            </div>
                        </div>
                        <div class="weather-description">
                            <span class="weather-icon">${icon}</span>
                            <div>
                                <div>${data.weather[0].main}</div>
                                <div style="font-size: 0.9rem; opacity: 0.8;">Feels like ${feelsLike}${tempUnit}</div>
                            </div>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-card">
                            <div class="detail-label">💧 Humidity</div>
                            <div class="detail-value">${humidity}%</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">💨 Wind Speed</div>
                            <div class="detail-value">${windSpeed} ${speedUnit}</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">🌡️ Pressure</div>
                            <div class="detail-value">${pressure} mb</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">👁️ Visibility</div>
                            <div class="detail-value">${visibility} km</div>
                        </div>
                    </div>
                </div>

                <div class="forecast-section">
                    <div class="forecast-title">📅 5-Day Forecast</div>
                    <div class="forecast-grid">
                        ${forecastList.map(item => {
                            const date = new Date(item.dt * 1000);
                            const dayName = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                            const forecastIcon = iconMap[item.weather[0].icon] || '🌤️';
                            return `
                                <div class="forecast-card">
                                    <div class="forecast-time">${dayName}</div>
                                    <div class="forecast-icon">${forecastIcon}</div>
                                    <div class="forecast-temp">${Math.round(item.main.temp)}${tempUnit}</div>
                                    <div class="forecast-desc">${item.weather[0].main}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Load default city on page load
        window.addEventListener('load', () => {
            fetchWeather('San Francisco');
        });
    </script>
</body>
</html>
